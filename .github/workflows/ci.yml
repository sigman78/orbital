name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==21.1.6
      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --style=file --dry-run --Werror

  shaders:
    name: Shader compilation and SPIR-V validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install spirv-val
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Install Slang 2026.14.1
        run: |
          curl -sSL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.14.1/slang-2026.14.1-linux-x86_64.tar.gz
          echo '21f2d7847385a770e569fb61b1507a7794d742d97850bce0432bff0032ca005f  slang.tar.gz' | sha256sum -c
          mkdir -p .tools/slang && tar -xzf slang.tar.gz -C .tools/slang
      - name: Check shaders
        run: python3 tools/check-shaders.py --compiler .tools/slang/bin/slangc

  cpu-tests-linux:
    name: CPU libraries and tests (GCC, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DORBITAL_BUILD_DEMO=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cpu-tests:
    name: CPU libraries and tests (MSVC, no GPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset release -DORBITAL_BUILD_DEMO=OFF
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
